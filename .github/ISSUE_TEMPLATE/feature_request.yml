name: Feature request
description: Suggest a focused improvement or new workflow.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the actual workflow and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and additional context
