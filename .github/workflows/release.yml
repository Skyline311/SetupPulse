name: Prepare release draft

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version tag
        run: |
          if ($env:RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Expected a vX.Y.Z tag.' }
          [xml]$project = Get-Content src/SetupPulse.App/SetupPulse.App.csproj -Raw
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and app version differ.' }
          $uiVersion = (Get-Content ui/package.json -Raw | ConvertFrom-Json).version
          if ($uiVersion -ne $version) { throw 'App and UI versions differ.' }
          if ((git rev-parse HEAD) -ne (git rev-list -n 1 $env:RELEASE_TAG)) { throw 'Tag and checkout differ.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE) { throw 'Release tag must point to reviewed main history.' }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build, test, and package
        run: ./scripts/build.ps1
      - name: Install Playwright Chromium
        run: npx playwright install chromium
        working-directory: ui
      - name: Run browser UI tests
        run: npm run test:e2e
        working-directory: ui
      - name: Create or update draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'Refusing to replace assets of a published release.' }
          } else {
            gh release create $env:RELEASE_TAG --draft --verify-tag --title "SetupPulse $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE) { throw 'Could not create release draft.' }
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $exeHash = (Get-FileHash -LiteralPath 'artifacts/win-x64/SetupPulse.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText('artifacts/SetupPulse.exe.sha256', "$exeHash *SetupPulse.exe`n")
          gh release upload $env:RELEASE_TAG 'artifacts/win-x64/SetupPulse.exe' 'artifacts/SetupPulse.exe.sha256' "artifacts/SetupPulse-$version-win-x64.zip" "artifacts/SetupPulse-$version-win-x64.zip.sha256" --clobber
          if ($LASTEXITCODE) { throw 'Could not upload release assets.' }
