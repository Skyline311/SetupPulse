name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Scan complete checkout history for secrets
        run: |
          $folder = Join-Path $env:RUNNER_TEMP ('gitleaks-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $folder | Out-Null
          $archive = Join-Path $folder 'gitleaks.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E') { throw 'Secret scanner checksum mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath $folder
          & (Join-Path $folder 'gitleaks.exe') git . --redact=100 --log-opts=--all --no-banner
          if ($LASTEXITCODE) { throw 'Secret scan failed.' }
      - name: Audit npm dependencies
        working-directory: ui
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE) { throw 'Dependency install failed.' }
          npm audit --audit-level=moderate
          if ($LASTEXITCODE) { throw 'npm dependency audit failed.' }
      - name: Audit NuGet dependencies
        run: |
          dotnet restore SetupPulse.sln
          if ($LASTEXITCODE) { throw 'NuGet restore failed.' }
          $audit = dotnet list SetupPulse.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE) { throw 'NuGet dependency audit failed.' }
          $audit | Write-Output
          $report = ($audit -join "`n") | ConvertFrom-Json
          if ($report.errors -or @($report.projects | Where-Object { $_.errors }).Count) { throw 'Incomplete NuGet audit.' }
          $vulnerable = @($report.projects.frameworks | ForEach-Object { $_.topLevelPackages; $_.transitivePackages } | Where-Object { $_.vulnerabilities })
          if ($vulnerable.Count) { throw 'Vulnerable NuGet packages found.' }
